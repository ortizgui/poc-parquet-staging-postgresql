services:
  postgres:
    image: postgres:16
    container_name: poc-postgres
    environment:
      POSTGRES_DB: pocdb
      POSTGRES_USER: pocuser
      POSTGRES_PASSWORD: pocpass
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocuser -d pocdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  ministack:
    image: localstack/localstack:latest
    container_name: poc-ministack
    environment:
      SERVICES: s3,sqs,sns
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Consumer: consome eventos S3 da SQS e faz bulk insert direto na custody_position
  # Para escalar: docker compose up -d --scale consumer=3
  consumer:
    build:
      context: .
      dockerfile: src/Worker/Dockerfile
    container_name: poc-consumer
    environment:
      DOTNET_ENVIRONMENT: Production
      Consumer__Target: direct
      Consumer__QueueName: poc-notification-queue
      Consumer__MaxWorkers: 4
      Consumer__ConsumerId: dotnet-worker
      AWS__ServiceURL: http://ministack:4566
      AWS__Region: us-east-1
      AWS__AccessKey: test
      AWS__SecretKey: test
      PostgreSQL__Host: postgres
      PostgreSQL__Database: pocdb
      PostgreSQL__Username: pocuser
      PostgreSQL__Password: pocpass
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy

volumes:
  pgdata:
